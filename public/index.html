<!DOCTYPE html>
<html>
<head>
  <title>Private Room RPS</title>

  <style>

    body {
      font-family: Arial;
      text-align: center;
      padding-top: 50px;
    }

    button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    input {
      padding: 10px;
      font-size: 18px;
    }

    #status {
      margin-top: 25px;
      font-size: 24px;
    }

  </style>
</head>

<body>

  <h1>Private Room RPS</h1>

  <button onclick="createRoom()">
    Create Room
  </button>

  <br><br>

  <input
    id="roomInput"
    placeholder="Enter Room Code">

  <button onclick="joinRoom()">
    Join Room
  </button>

  <div id="roomCode"></div>

  <div id="status"></div>

  <br>

  <button onclick="sendMove('rock')">
    Rock
  </button>

  <button onclick="sendMove('paper')">
    Paper
  </button>

  <button onclick="sendMove('scissors')">
    Scissors
  </button>

  <script src="/socket.io/socket.io.js"></script>

  <script>

    const socket = io();

    let currentRoom = null;

    function createRoom() {

      socket.emit('createRoom');
    }

    function joinRoom() {

      const roomCode =
        document
          .getElementById('roomInput')
          .value;

      socket.emit('joinRoom', roomCode);
    }

    function sendMove(move) {

      if (!currentRoom)
        return;

      socket.emit('move', {
        roomCode: currentRoom,
        move
      });

      document
        .getElementById('status')
        .innerText =
        'Move submitted';
    }

    socket.on('roomCreated',
      (roomCode) => {

      currentRoom = roomCode;

      document
        .getElementById('roomCode')
        .innerHTML =
        `
        Room Code:
        <b>${roomCode}</b>
        `;

      document
        .getElementById('status')
        .innerText =
        'Waiting for opponent...';
    });

    socket.on('startGame',
      (roomCode) => {

      currentRoom = roomCode;

      document
        .getElementById('status')
        .innerText =
        'Game started!';
    });

    socket.on('result',
      (data) => {

      document
        .getElementById('status')
        .innerHTML =
        `
        Player 1:
        ${data.move1}<br>

        Player 2:
        ${data.move2}<br><br>

        ${data.result}
        `;
    });

    socket.on('errorMessage',
      (msg) => {

      alert(msg);
    });

  </script>

</body>
</html>
